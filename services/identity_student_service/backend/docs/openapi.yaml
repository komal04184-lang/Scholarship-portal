openapi: 3.0.3
info:
  title: ApexScholar Identity & Student Service API
  version: 1.0.0
  description: |
    Authentication, authorization, student profile management, and user administration microservice for the ApexScholar Portal.
    Backed by PostgreSQL (identity_db).
servers:
  - url: http://localhost:3001
    description: Direct service
  - url: http://localhost:3000
    description: Via API Gateway

tags:
  - name: Authentication
    description: User registration, login, logout, password reset, and verification
  - name: Student Profile
    description: Student academic profile management
  - name: Students Directory
    description: Public or authorized student queries
  - name: Admin
    description: Administrative user management and analytics
  - name: Health
    description: Service health and database status

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check endpoint
      responses:
        '200':
          description: Service is healthy
        '503':
          description: Service is degraded or database is disconnected

  /api/v1/auth/register:
    post:
      tags: [Authentication]
      summary: Register a new student or user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, full_name]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 6 }
                full_name: { type: string }
                role: { type: string, enum: [student, reviewer, admin], default: student }
                phone: { type: string }
      responses:
        '201':
          description: User registered successfully
        '400':
          description: Validation error or email already in use

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Successfully authenticated; returns JWT token and user info
        '401':
          description: Invalid email or password

  /api/v1/auth/me:
    get:
      tags: [Authentication]
      summary: Get currently authenticated user details
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Current user profile
        '401':
          description: Unauthorized

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Invalidate user session and clear auth cookies
      responses:
        '200':
          description: Successfully logged out

  /api/v1/profile:
    get:
      tags: [Student Profile]
      summary: Get student profile for current authenticated user
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Student profile data
        '401':
          description: Unauthorized

    put:
      tags: [Student Profile]
      summary: Update student profile
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enrollment_number: { type: string }
                date_of_birth: { type: string, format: date }
                gender: { type: string }
                phone_number: { type: string }
                course: { type: string }
                department: { type: string }
                institution: { type: string }
                admission_year: { type: integer }
                current_year_semester: { type: string }
      responses:
        '200':
          description: Profile updated successfully

  /api/v1/admin/users:
    get:
      tags: [Admin]
      summary: List registered users with pagination and role filters
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: role, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: User listing
        '403':
          description: Admin privileges required

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
