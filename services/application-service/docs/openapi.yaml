openapi: 3.0.3
info:
  title: ApexScholar Application Service API
  version: 1.0.0
  description: Application management microservice. Handles scholarship applications, document uploads (GridFS + local), status tracking.
servers:
  - url: http://localhost:3003
  - url: http://localhost:3000
tags:
  - name: Applications
  - name: Documents
  - name: Health

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200': { description: Running }

  /api/v1/applications:
    post:
      tags: [Applications]
      summary: Submit scholarship application
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scholarship_id]
              properties:
                scholarship_id: { type: string }
                answers: { type: object }
      responses:
        '201': { description: Created }
        '409': { description: Already applied }

    get:
      tags: [Applications]
      summary: List applications
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string } }
      responses:
        '200': { description: List }

  /api/v1/applications/{id}:
    get:
      tags: [Applications]
      summary: Get application
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Found }
        '404': { description: Not found }

  /api/v1/applications/{id}/documents:
    post:
      tags: [Documents]
      summary: Upload document (stored in GridFS + local)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                document_type: { type: string }
      responses:
        '201': { description: Uploaded }
        '400': { description: Bad request }

  /api/v1/documents/{docId}/download:
    get:
      tags: [Documents]
      summary: Download document file
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: docId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: File stream }
        '403': { description: Access denied }
        '404': { description: Not found }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
